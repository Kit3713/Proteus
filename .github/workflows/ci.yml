# Proteus CI pipeline.
#
# Enforces the project's quality bar from CONTRIBUTING.md "Style and quality
# bar" and PLAN.md phases A and G:
#   - cargo fmt --check clean
#   - cargo clippy --all-targets -- -D warnings clean
#   - cargo test passes
#   - cargo build --release succeeds
#   - stripped release binary is <= 4.75 MB (hard release-time cap; CI here
#     emits a soft warn only — the hard fail lives in release.yml)
#   - cold release build wallclock logged (soft signal, not enforced)
#
# Note: until phase A skeleton lands, Cargo.toml does not exist in the repo
# and the cargo-invoking jobs will fail with "could not find Cargo.toml".
# That is expected; the workflow exists so it starts passing the moment the
# skeleton is committed. We deliberately do not gate on Cargo.toml's presence
# because that would mask real failures later.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# B7: top-level permissions block following the principle of least privilege
# (see https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs).
# CI only needs to read the repository tree to run fmt/clippy/test/build —
# no PR comments, no release writes, no token exfil surface. Individual jobs
# below can override these to grant a strictly smaller set if needed.
permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch, except on main where every
# push to the protected branch must complete (release tagging, history).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Format check is libc-independent and fast; runs on plain ubuntu.
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      # Reads rust-toolchain.toml so the pinned channel installs verbatim;
      # rustfmt + clippy are listed in `components` there, so no `with:` here.
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7  # v1
      - name: cargo fmt --check
        run: cargo fmt --check

  # Lockfile freshness check. The release pipeline depends on Cargo.lock as
  # the single source of truth for dependency versions (see
  # wiki/reproducible-builds.md). This job runs `cargo metadata --locked`,
  # which fails if Cargo.lock is missing or would need to be regenerated.
  # Catches PRs that bump Cargo.toml without committing a refreshed lockfile.
  lockfile:
    name: lockfile freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7  # v1
      - name: cargo metadata --locked
        run: cargo metadata --locked --format-version 1 > /dev/null

  # Clippy is also libc-independent; runs on plain ubuntu for speed.
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7  # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

  # Tests run inside the primary target distro (Fedora 43) so behavior
  # tracks what users will actually see on the dev host.
  test:
    name: cargo test
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      # gcc + pkg-config for crates that link to system libs.
      # dbus-devel is pre-installed because zbus pulls it in for system-bus
      # tests starting in phase B; staging it here keeps the container ready
      # rather than reshuffling the workflow each phase.
      # openssl-devel covers any TLS-using build script in transitive deps.
      - name: Install build dependencies
        run: dnf install -y gcc pkg-config dbus-devel openssl-devel
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7  # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: cargo test --locked
        run: cargo test --locked

  # Release build + size enforcement. Runs in the Fedora container because
  # the stripped binary size depends on glibc version and Fedora 43 is the
  # primary target (PLAN.md "CI runner: start with GitHub-hosted Fedora
  # container, switch to self-hosted only if it hurts").
  # Compilation jobs (build + cross-build) are expensive. We run them only on
  # push to main and on tagged releases — not on PRs — to keep PR feedback fast
  # (fmt + clippy + test in ~1-2 min). Tags trigger the full release.yml
  # workflow, which produces published binaries.
  build-and-size:
    name: build + size check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      # See test job for rationale on each package.
      # binutils provides `strip`; coreutils provides `wc`; both are
      # already in the base image but listed defensively.
      - name: Install build dependencies
        run: dnf install -y gcc pkg-config dbus-devel openssl-devel binutils coreutils
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7  # v1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      # Time the cold release build. Soft signal only: the README targets
      # under 60s on the *dev host*, and CI runner perf is not our dev host.
      # Logged so regressions are visible, but never fails the job.
      - name: cargo build --release --locked (timed)
        run: |
          set -euo pipefail
          # `time` writes to stderr; capture it so we can echo the line back
          # with a marker that's easy to grep in CI logs.
          { time cargo build --release --locked ; } 2> build-time.txt
          echo "PROTEUS_BUILD_TIME (soft signal, not enforced):"
          cat build-time.txt
      # Strip and log size. The ≤4.75 MB target is the release-time hard cap
      # enforced in release.yml; CI emits a soft warn so feature work in
      # flight does not block PR feedback. The project optimizes aggressively
      # (opt-level=z, lto, codegen-units=1, panic=abort, strip) and tracks
      # size to catch regressions.
      - name: Strip and log size
        run: |
          set -euo pipefail
          BIN=target/release/proteus
          strip "$BIN"
          SIZE=$(wc -c < "$BIN")
          echo "PROTEUS_BINARY_SIZE_BYTES=${SIZE}"
          echo "PROTEUS_BINARY_SIZE_TARGET_BYTES=4750000"
          if [ "$SIZE" -gt 4750000 ]; then
            echo "WARN: stripped proteus binary is ${SIZE} bytes, exceeds 4.75 MB target — consider cargo bloat" >&2
          else
            echo "OK: stripped proteus binary is ${SIZE} bytes (under 4.75 MB target)"
          fi

  # ARM cross-compile sanity. Catches dependency churn that breaks ARM
  # before a release tag tries to build the artifact for real. Runs on plain
  # ubuntu-latest because cross-compile toolchains are easier to install via
  # apt than dnf, and this job only needs to prove that the tree still builds
  # and strips under the 4.75 MB cap on the secondary architectures.
  #
  # Roadmap Milestone 5: matrix expanded to cover armv7 (Pi 2/3, ARM
  # Chromebooks) alongside the original aarch64 (Pi 4/5, Apple Silicon
  # Linux VMs).
  #
  # We do not run the produced binary (no ARM runner) and we do not gate
  # other jobs on this one — it's a parallel signal, not a blocker for x86_64.
  cross-build-arm:
    name: cross-build ${{ matrix.target }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            apt-pkg: gcc-aarch64-linux-gnu
            cc: aarch64-linux-gnu-gcc
            strip: aarch64-linux-gnu-strip
            cache-key: aarch64
          - target: armv7-unknown-linux-gnueabihf
            apt-pkg: gcc-arm-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            strip: arm-linux-gnueabihf-strip
            cache-key: armv7
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install ${{ matrix.target }} cross-compile toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt-pkg }}
      - uses: actions-rust-lang/setup-rust-toolchain@2b1f5e9b395427c92ee4e3331786ca3c37afe2d7  # v1
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: ${{ matrix.cache-key }}
      - name: cargo build --release --locked --target ${{ matrix.target }}
        env:
          # `cargo` reads CARGO_TARGET_<TARGET>_LINKER from the
          # environment; the underscored uppercase form is the one
          # cargo expects, regardless of the matrix entry's spelling.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Strip and log size (${{ matrix.target }})
        run: |
          set -euo pipefail
          BIN=target/${{ matrix.target }}/release/proteus
          ${{ matrix.strip }} "$BIN"
          SIZE=$(wc -c < "$BIN")
          echo "PROTEUS_BINARY_SIZE_BYTES=${SIZE}"
          echo "PROTEUS_BINARY_SIZE_TARGET_BYTES=4750000"
          if [ "$SIZE" -gt 4750000 ]; then
            echo "WARN: stripped ${{ matrix.target }} proteus binary is ${SIZE} bytes, exceeds 4.75 MB target" >&2
          else
            echo "OK: stripped ${{ matrix.target }} proteus binary is ${SIZE} bytes (under 4.75 MB target)"
          fi

  # Stream 3 acceptance: lint packaging files and shell scripts so
  # lockstep coherence regressions (e.g. install.sh enabling proteus-events
  # but the RPM spec leaving it out) surface in CI rather than in a
  # post-install bug report. This is a best-effort matrix — full distro
  # container installs (Fedora 43 / Debian 13 / Gentoo / Alpine 3.20) are
  # the long-term acceptance gate (see docs/ROADMAP.md Stream 3) but they
  # require privileged systemd containers and are tracked separately.
  packaging-lint:
    name: packaging lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install lint tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck dash systemd
      - name: sh -n install.sh / uninstall.sh / dispatcher (B13)
        run: |
          set -euo pipefail
          # B13: validate POSIX shell syntax via dash, the strictest /bin/sh
          # in the wild. `sh -n` does parse-only — does not execute.
          for f in install.sh uninstall.sh dist/networkmanager/dispatcher.d/01-proteus; do
            echo "=== dash -n $f ==="
            dash -n "$f"
          done
      - name: shellcheck install.sh / uninstall.sh / dispatcher
        run: |
          set -euo pipefail
          # shellcheck supplements `sh -n` with semantic checks (unquoted
          # vars, fork-spawning idioms, etc.). Run with --shell=sh so it
          # flags bashisms.
          shellcheck --shell=sh install.sh uninstall.sh \
            dist/networkmanager/dispatcher.d/01-proteus
      - name: systemd-analyze verify proteus-events.service
        run: |
          set -euo pipefail
          # systemd-analyze verify runs the same parser systemctl uses,
          # but offline and against a single file. Catches typos in
          # KillMode= / ExecStart= / Restart= before a release ships.
          systemd-analyze verify dist/systemd/proteus-events.service \
            || echo "WARN: systemd-analyze verify reported issues — review above"
      - name: Spec / packaging consistency
        run: |
          set -euo pipefail
          # Stream 3 invariant: every packaging recipe must enable / install
          # proteus-events.service. Grep for the unit name in each file.
          fail=0
          for f in dist/rpm/proteus.spec dist/debian/rules \
                   dist/gentoo/proteus-0.1.0.ebuild install.sh; do
            if ! grep -q 'proteus-events' "$f"; then
              echo "FAIL: $f does not reference proteus-events" >&2
              fail=1
            else
              echo "OK: $f references proteus-events"
            fi
          done
          # Cargo.toml description must be < 256 chars (M4 / crates.io cap).
          desc_len=$(python3 -c '
          import re
          for line in open("Cargo.toml"):
              m = re.match(r"description = \"(.*)\"\s*$", line)
              if m:
                  print(len(m.group(1))); break
          ')
          echo "Cargo.toml description length: ${desc_len}"
          if [ "${desc_len}" -ge 256 ]; then
            echo "FAIL: description must be < 256 chars (M4)" >&2
            fail=1
          fi
          exit "$fail"
