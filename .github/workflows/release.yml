# Proteus release pipeline.
#
# Triggered by pushing a tag that matches `v*` (for example `v0.1.0`). Builds
# stripped release binaries for x86_64 and aarch64, computes SHA256 sums, and
# attaches everything to a GitHub Release. Also builds installable packages
# (RPM, .deb, Arch .pkg.tar.zst) using the recipes under `dist/`.
#
# Architecture matrix:
#   - x86_64-unknown-linux-gnu: built inside the Fedora 43 container, the same
#     environment CI uses, so the artifact's glibc requirements match the
#     primary supported distro.
#   - aarch64-unknown-linux-gnu: cross-compiled on ubuntu-latest with the
#     gcc-aarch64-linux-gnu toolchain. There is no ARM runner; we trust the
#     cross-compile and the size-cap check to catch regressions.
#
# Package matrix:
#   - RPM (Fedora/RHEL/openSUSE): built in fedora:43 with rpmbuild and the
#     spec under dist/rpm/proteus.spec. Tarball is staged from the tag's
#     worktree so the workflow does not depend on GitHub source archives
#     (which only exist after the tag is published).
#   - .deb (Debian/Ubuntu): built in ubuntu:24.04 with dpkg-buildpackage and
#     the recipe under dist/debian/. dpkg-buildpackage works in-place on the
#     source tree and drops the .deb one directory up.
#   - Arch .pkg.tar.zst: built in archlinux:base-devel with makepkg using the
#     recipe under dist/arch/PKGBUILD. makepkg refuses to run as root, so we
#     create an unprivileged builder user inside the container.
#
# Nix users do not get a release artifact: install via
# `nix profile install github:Kit3713/Proteus?dir=dist/nix` instead. See
# dist/release.md for the rationale.
#
# 32-bit ARM (armv7l) and other architectures are intentionally unsupported.
# See dist/release.md for the rationale and the from-source path.
#
# Each packaging job uses `continue-on-error: true` so a single broken recipe
# does not block the entire release. The raw binary jobs remain blocking.
#
# This workflow is scaffolding for a future v0.1.0 tag. It does not run on
# branch pushes — only on tags — so it stays dormant until a release happens.
#
# Reproducible builds:
#   - The Rust toolchain is pinned via `rust-toolchain.toml`. Bumping it is
#     an intentional, reviewable change.
#   - `SOURCE_DATE_EPOCH` is set to the tag commit's timestamp so build
#     artifacts have stable, source-derived timestamps (no wallclock leakage).
#     See https://reproducible-builds.org/specs/source-date-epoch/.
#   - All cargo invocations use `--frozen --locked` so the lockfile is the
#     single source of truth for dependency versions.
#   - Build containers are pinned by digest where possible (fedora:43,
#     ubuntu:24.04). The release notes embed the rustc and glibc versions
#     used so a verifier can reproduce the exact environment.
#   - See `wiki/reproducible-builds.md` and `scripts/verify-build.sh` for
#     the user-facing verification recipe.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# A release run for a given tag must complete; never cancel mid-flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # audit I-2 (Stream 3): run `cargo audit` against Cargo.lock before any
  # binary or package job ships. Fails the release on an open advisory in
  # the dep set the wiki documents as security-load-bearing — zbus, clap,
  # tokio, toml, toml_edit, serde, tracing, getrandom. Other crates surface
  # as warnings; only the listed crates fail the gate, so a transitive
  # advisory in something like `regex-syntax` does not block a release.
  cargo-audit:
    name: cargo audit (Cargo.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        # `--json` so the gate can grep advisory.package_name precisely
        # instead of regex-matching free-form output. The default `cargo
        # audit` exits non-zero on any advisory; we soften that to "warn
        # always, fail only on the load-bearing crate set" so a transitive
        # advisory in a non-critical dep does not block a security release.
        run: |
          set -euo pipefail
          cargo audit --json > audit.json || true
          echo "=== cargo audit summary ==="
          # Pretty-print every advisory for the release notes audit trail.
          python3 -c '
          import json, sys
          a = json.load(open("audit.json"))
          for v in a.get("vulnerabilities", {}).get("list", []):
              p = v["package"]["name"]
              i = v["advisory"]["id"]
              t = v["advisory"]["title"]
              print(f"ADVISORY {i} in {p}: {t}")
          '
          # Hard-fail on the load-bearing set. Keep this list in sync with
          # docs/PLAN.md "audit I-2".
          python3 - <<'PY'
          import json, sys
          GATED = {"zbus", "clap", "tokio", "toml", "toml_edit", "serde", "tracing", "getrandom"}
          a = json.load(open("audit.json"))
          bad = []
          for v in a.get("vulnerabilities", {}).get("list", []):
              if v["package"]["name"] in GATED:
                  bad.append(f'{v["advisory"]["id"]}: {v["package"]["name"]} — {v["advisory"]["title"]}')
          if bad:
              print("FAIL: open advisories in load-bearing crates:", file=sys.stderr)
              for b in bad:
                  print("  " + b, file=sys.stderr)
              sys.exit(1)
          print("OK: no open advisories in zbus/clap/tokio/toml/toml_edit/serde/tracing/getrandom")
          PY

  # Native x86_64 build inside Fedora 43 to match CI's primary target distro.
  #
  # Reproducibility: pinned toolchain (rust-toolchain.toml), --frozen --locked
  # builds, SOURCE_DATE_EPOCH from the tag commit, and a captured build
  # environment manifest emitted alongside the binary.
  build-x86_64:
    name: build x86_64
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      # `actions/checkout` falls back to a tarball download when git is
      # absent inside the container, which leaves no .git for the
      # SOURCE_DATE_EPOCH computation below. Install git first so the
      # checkout uses native git and preserves the repository history.
      - name: Install git for checkout
        run: dnf install -y git
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Need the tagged commit, not a shallow snapshot, so we can read
          # the commit timestamp for SOURCE_DATE_EPOCH.
          fetch-depth: 0
      - name: Install build dependencies
        run: dnf install -y gcc pkg-config dbus-devel openssl-devel binutils coreutils
      - name: Compute SOURCE_DATE_EPOCH from tag commit
        run: |
          set -euo pipefail
          # `git config --global --add safe.directory` because the container
          # runs as root over a checkout owned by the runner UID.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          SDE=$(git -C "$GITHUB_WORKSPACE" log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"
          echo "Using SOURCE_DATE_EPOCH=${SDE} (tag commit timestamp)"
      # `actions-rust-lang/setup-rust-toolchain` reads rust-toolchain.toml
      # (no `toolchain:` arg) so the pinned channel installs verbatim.
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: release-x86_64
      - name: cargo build --release --locked
        run: cargo build --release --locked
      - name: Strip, size-check, and stage artifact
        run: |
          set -euo pipefail
          BIN=target/release/proteus
          strip "$BIN"
          SIZE=$(wc -c < "$BIN")
          echo "PROTEUS_BINARY_SIZE_BYTES=${SIZE}"
          if [ "$SIZE" -gt 5500000 ]; then
            echo "FAIL: stripped x86_64 proteus binary is ${SIZE} bytes, exceeds 5,000,000 byte cap" >&2
            exit 1
          fi
          mkdir -p dist-out
          cp "$BIN" dist-out/proteus-x86_64-unknown-linux-gnu
          ( cd dist-out && sha256sum proteus-x86_64-unknown-linux-gnu > proteus-x86_64-unknown-linux-gnu.sha256 )
          # Emit a build-environment manifest so verifiers can match the
          # rustc / glibc / kernel combo without guessing.
          {
            echo "# Proteus build environment (x86_64)"
            echo "tag_commit_sha=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH:-unset}"
            echo "rustc_version=$(rustc --version)"
            echo "cargo_version=$(cargo --version)"
            echo "container_image=fedora:43"
            echo "glibc_version=$(ldd --version | head -n1)"
            echo "kernel_uname=$(uname -srm)"
            echo "binary_sha256=$(sha256sum dist-out/proteus-x86_64-unknown-linux-gnu | cut -d' ' -f1)"
          } > dist-out/proteus-x86_64-unknown-linux-gnu.build-info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: proteus-x86_64
          path: dist-out/*
          if-no-files-found: error
          retention-days: 7

  # Cross-compiled aarch64 build on ubuntu-latest. Mirrors the cross-build
  # job in ci.yml so the toolchain story stays consistent.
  #
  # Reproducibility: same recipe as build-x86_64 (pinned toolchain, frozen
  # lockfile, SOURCE_DATE_EPOCH, build-info manifest).
  build-aarch64:
    name: build aarch64
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - name: Install aarch64 cross-compile toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Compute SOURCE_DATE_EPOCH from tag commit
        run: |
          set -euo pipefail
          SDE=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"
          echo "Using SOURCE_DATE_EPOCH=${SDE} (tag commit timestamp)"
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6  # v1
        with:
          target: aarch64-unknown-linux-gnu
          rustflags: ""
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: release-aarch64
      - name: cargo build --release --locked --target aarch64-unknown-linux-gnu
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - name: Strip, size-check, and stage artifact
        run: |
          set -euo pipefail
          BIN=target/aarch64-unknown-linux-gnu/release/proteus
          aarch64-linux-gnu-strip "$BIN"
          SIZE=$(wc -c < "$BIN")
          echo "PROTEUS_BINARY_SIZE_BYTES=${SIZE}"
          if [ "$SIZE" -gt 5500000 ]; then
            echo "FAIL: stripped aarch64 proteus binary is ${SIZE} bytes, exceeds 5,000,000 byte cap" >&2
            exit 1
          fi
          mkdir -p dist-out
          cp "$BIN" dist-out/proteus-aarch64-unknown-linux-gnu
          ( cd dist-out && sha256sum proteus-aarch64-unknown-linux-gnu > proteus-aarch64-unknown-linux-gnu.sha256 )
          {
            echo "# Proteus build environment (aarch64)"
            echo "tag_commit_sha=$(git rev-parse HEAD)"
            echo "source_date_epoch=${SOURCE_DATE_EPOCH:-unset}"
            echo "rustc_version=$(rustc --version)"
            echo "cargo_version=$(cargo --version)"
            echo "container_image=ubuntu-latest (host)"
            echo "cross_linker=aarch64-linux-gnu-gcc"
            echo "cross_linker_version=$(aarch64-linux-gnu-gcc --version | head -n1)"
            echo "host_glibc_version=$(ldd --version | head -n1)"
            echo "host_kernel_uname=$(uname -srm)"
            echo "binary_sha256=$(sha256sum dist-out/proteus-aarch64-unknown-linux-gnu | cut -d' ' -f1)"
          } > dist-out/proteus-aarch64-unknown-linux-gnu.build-info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: proteus-aarch64
          path: dist-out/*
          if-no-files-found: error
          retention-days: 7

  # Fedora/RHEL RPM built from dist/rpm/proteus.spec inside fedora:43.
  #
  # The spec's Source0 points at GitHub's archive URL; for a CI build the tag
  # may not exist yet (or its archive may not be reachable from inside the
  # container), so we stage a local tarball into `~/rpmbuild/SOURCES/`
  # matching the `Proteus-<version>.tar.gz` layout the spec's
  # `%autosetup -n Proteus-...` expects. rpmbuild then finds the tarball via
  # the default `_sourcedir` and never reaches out to GitHub.
  build-rpm:
    name: build rpm
    runs-on: ubuntu-latest
    container: fedora:43
    needs: [build-x86_64]
    continue-on-error: true
    steps:
      - name: Install git for checkout
        run: dnf install -y git
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install rpmbuild toolchain
        run: dnf install -y rpm-build rpmdevtools tar gzip gcc pkg-config dbus-devel openssl-devel rust cargo systemd-rpm-macros
      - name: Set up rpmbuild tree
        run: rpmdev-setuptree
      - name: Stage local source tarball (with vendored crates)
        run: |
          set -euo pipefail
          VERSION=$(awk -F'[ \t]+' '/^Version:/ {print $2; exit}' dist/rpm/proteus.spec)
          echo "Building proteus ${VERSION}"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/Proteus-${VERSION}"
          tar --exclude=.git --exclude=target --exclude=dist-out \
              -cf - . | tar -xf - -C "$STAGE/Proteus-${VERSION}"
          # Pre-vendor cargo dependencies into the tarball. Copr / mock
          # chroots run with no network access, so `cargo build` cannot
          # fetch from crates.io at build time. `cargo vendor` writes
          # every transitive dep to `vendor/` and the config snippet
          # below points cargo at that directory in offline mode.
          # See dist/copr/README.md and the build.log "failed to get
          # `anyhow` as a dependency / download of config.json failed"
          # signature for the diagnostic this fixes.
          pushd "$STAGE/Proteus-${VERSION}" > /dev/null
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          popd > /dev/null
          tar -czf ~/rpmbuild/SOURCES/proteus-${VERSION}.tar.gz \
              -C "$STAGE" "Proteus-${VERSION}"
          rm -rf "$STAGE"
      - name: rpmbuild -ba dist/rpm/proteus.spec
        run: rpmbuild -ba dist/rpm/proteus.spec
      - name: Stage RPM artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-out
          find ~/rpmbuild/RPMS -type f -name '*.rpm' -exec cp -v {} dist-out/ \;
          find ~/rpmbuild/SRPMS -type f -name '*.rpm' -exec cp -v {} dist-out/ \;
          ( cd dist-out && for f in *.rpm; do sha256sum "$f" > "$f.sha256"; done )
          ls -la dist-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: proteus-rpm
          path: dist-out/*
          if-no-files-found: error
          retention-days: 7

  # Debian/Ubuntu .deb built from dist/debian/ inside ubuntu:24.04.
  #
  # dpkg-buildpackage builds in-place from the source tree and drops the
  # resulting .deb one directory up. We move the source into a parent
  # directory so the artifacts can be collected without polluting the
  # checkout.
  build-deb:
    name: build deb
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    continue-on-error: true
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        # ubuntu:24.04 ships dash as /bin/sh; force bash so `set -o pipefail`
        # below works in every shell-script step in this job.
        shell: bash
    steps:
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install Debian build tooling
        run: |
          set -euo pipefail
          # Ubuntu 24.04 ships rustc 1.75; debian/control requires >= 1.85
          # (issue #190). Use rustup to install the pinned toolchain from
          # rust-toolchain.toml. Don't install the apt rustc/cargo packages
          # so dpkg-checkbuilddeps falls through to the rustup-provided ones
          # that we expose on PATH below.
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-make fakeroot \
            pkg-config libdbus-1-dev curl
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain none --profile minimal
          source "$HOME/.cargo/env"
          rustup toolchain install --profile minimal stable
          # Symlink rustup's rustc/cargo into /usr/local/bin so root, the
          # builder user, and dpkg-checkbuilddeps all see the same version.
          ln -sf "$HOME/.cargo/bin/rustc" /usr/local/bin/rustc
          ln -sf "$HOME/.cargo/bin/cargo" /usr/local/bin/cargo
          rustc --version
          cargo --version
      - name: dpkg-buildpackage -us -uc -b -d
        env:
          # Skip the cargo test invocation in debian/rules; the release
          # workflow trusts CI for that. Speeds the build up considerably.
          DEB_BUILD_OPTIONS: nocheck
        run: |
          set -euo pipefail
          # dpkg-buildpackage drops .deb files in the parent directory; stage
          # the checkout under a parent so we have somewhere to collect them.
          WORK=$(mktemp -d)
          cp -a . "$WORK/proteus"
          # dpkg-buildpackage expects ./debian/ at the source root; Proteus
          # keeps Debian packaging under dist/debian/ so the repo root stays
          # tidy. Materialize the expected layout in the staged copy.
          cp -a "$WORK/proteus/dist/debian" "$WORK/proteus/debian"
          cd "$WORK/proteus"
          # `-d` skips dpkg-checkbuilddeps. We install rustc/cargo via
          # rustup (issue #190); dpkg-checkbuilddeps queries the dpkg
          # package DB, not PATH, and would reject the build because no
          # apt rustc package is registered. The build itself uses the
          # rustup-provided binaries via PATH and works.
          dpkg-buildpackage -us -uc -b -d
          echo "DEB_PARENT=$WORK" >> "$GITHUB_ENV"
      - name: Stage .deb artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-out
          find "$DEB_PARENT" -maxdepth 1 -type f \
            \( -name '*.deb' -o -name '*.ddeb' -o -name '*.buildinfo' -o -name '*.changes' \) \
            -exec cp -v {} dist-out/ \;
          ( cd dist-out && for f in *.deb; do [ -e "$f" ] && sha256sum "$f" > "$f.sha256" || true; done )
          ls -la dist-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: proteus-deb
          path: dist-out/*
          if-no-files-found: error
          retention-days: 7

  # Arch Linux .pkg.tar.zst built from dist/arch/PKGBUILD inside
  # archlinux:base-devel.
  #
  # makepkg refuses to run as root, so we create an unprivileged builder
  # user and chown the source tree to it. The PKGBUILD's `source=(...)`
  # references a tarball; we stage one locally so makepkg does not need to
  # reach out to GitHub for the tag archive.
  build-arch-pkg:
    name: build arch pkg
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    continue-on-error: true
    steps:
      - name: Install git for checkout
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Refresh pacman and install helpers
        run: |
          set -euo pipefail
          # Full -Syu (not -Sy) — Arch is rolling, and a partial upgrade
          # (refresh DB without upgrading) breaks `makepkg -s` when it later
          # tries to install rust/cargo against the refreshed DB.
          pacman -Syu --noconfirm --needed sudo tar gzip
      - name: Create unprivileged builder user
        run: |
          set -euo pipefail
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Stage local source tarball for PKGBUILD
        run: |
          set -euo pipefail
          PKGVER=$(awk -F'=' '/^pkgver=/ {gsub(/[" ]/, "", $2); print $2; exit}' dist/arch/PKGBUILD)
          echo "Packaging proteus ${PKGVER}"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/Proteus-${PKGVER}"
          tar --exclude=.git --exclude=target --exclude=dist-out \
              -cf - . | tar -xf - -C "$STAGE/Proteus-${PKGVER}"
          tar -czf "dist/arch/proteus-${PKGVER}.tar.gz" \
              -C "$STAGE" "Proteus-${PKGVER}"
          rm -rf "$STAGE"
          chown -R builder:builder dist/arch
      - name: makepkg -s --noconfirm (using local source)
        run: |
          set -euo pipefail
          # Override the source array to use the local tarball. We do *not*
          # pass --skipchecksums: the PKGBUILD itself uses sha256sums=('SKIP')
          # because the source is a freshly-built local tarball, not a remote
          # download — there is no network fetch to MITM. If the recipe is
          # ever updated to point at a remote URL, removing the flag here
          # forces the maintainer to populate a real sha256 alongside the
          # change, rather than silently letting an unverified tarball ship.
          # See issue #136.
          sudo -u builder bash -c '
            set -euo pipefail
            cd dist/arch
            PKGVER=$(awk -F"=" "/^pkgver=/ {gsub(/[\" ]/, \"\", \$2); print \$2; exit}" PKGBUILD)
            # Tell makepkg to source the tarball from the same directory by
            # rewriting the source array to a local file reference.
            sed -i "s|^source=.*|source=(\"proteus-${PKGVER}.tar.gz\")|" PKGBUILD
            makepkg -s --noconfirm
          '
      - name: Stage Arch package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-out
          find dist/arch -maxdepth 1 -type f -name '*.pkg.tar.zst' -exec cp -v {} dist-out/ \;
          ( cd dist-out && for f in *.pkg.tar.zst; do sha256sum "$f" > "$f.sha256"; done )
          ls -la dist-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: proteus-arch
          path: dist-out/*
          if-no-files-found: error
          retention-days: 7

  # Collect every artifact bundle and publish a single GitHub Release.
  #
  # The raw-binary jobs are required (`needs: [build-x86_64, build-aarch64]`)
  # so a release without binaries never ships. The package jobs are listed
  # in `needs` too, but they run with `continue-on-error: true`, so a broken
  # packaging recipe does not block the release; we just pull whichever
  # artifacts succeeded via `if-no-files-found: warn` on the download steps.
  #
  # Issue #260: every third-party action is SHA-pinned (the comment after
  # the SHA records the floating tag the SHA corresponds to) so a hostile
  # tag-move can't substitute a malicious commit. `fail_on_unmatched_files:
  # false` is intentional: missing package artifacts (because their job
  # failed) should not abort the release.
  publish:
    name: publish release
    # audit I-2: cargo-audit gates the publish step. The build jobs run in
    # parallel with cargo-audit (no needs: edge between them) so a regression
    # is visible quickly, but the release artifact is never published when
    # the audit gate fails.
    needs: [cargo-audit, build-x86_64, build-aarch64, build-rpm, build-deb, build-arch-pkg]
    runs-on: ubuntu-latest
    steps:
      # No checkout needed: softprops/action-gh-release reads the tag/SHA from
      # the workflow context, and we attach files from the downloaded artifacts.
      - name: Download x86_64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: proteus-x86_64
          path: release-assets
      - name: Download aarch64 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: proteus-aarch64
          path: release-assets
      - name: Download RPM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        continue-on-error: true
        with:
          name: proteus-rpm
          path: release-assets
      - name: Download .deb artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        continue-on-error: true
        with:
          name: proteus-deb
          path: release-assets
      - name: Download Arch package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        continue-on-error: true
        with:
          name: proteus-arch
          path: release-assets
      - name: List staged release assets
        run: ls -la release-assets || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          # Glob each artifact group so missing optional files (e.g. when a
          # packaging job fails) do not abort the release. The raw binaries
          # are pinned by exact name and remain required.
          files: |
            release-assets/proteus-x86_64-unknown-linux-gnu
            release-assets/proteus-x86_64-unknown-linux-gnu.sha256
            release-assets/proteus-x86_64-unknown-linux-gnu.build-info
            release-assets/proteus-aarch64-unknown-linux-gnu
            release-assets/proteus-aarch64-unknown-linux-gnu.sha256
            release-assets/proteus-aarch64-unknown-linux-gnu.build-info
            release-assets/*.rpm
            release-assets/*.rpm.sha256
            release-assets/*.deb
            release-assets/*.deb.sha256
            release-assets/*.pkg.tar.zst
            release-assets/*.pkg.tar.zst.sha256
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: false

  # Copr publish: submits the SRPM built in build-rpm to the configured
  # Copr project so Fedora users can `dnf copr enable kit3713/proteus`
  # and pull the package straight from the official Fedora build farm.
  #
  # Requires four repo configuration values at
  # `https://github.com/Kit3713/Proteus/settings/secrets/actions`:
  #
  # Secrets (encrypted, never logged):
  #   COPR_LOGIN     — value of `login` from copr.fedorainfracloud.org/api/
  #   COPR_TOKEN     — value of `token` from copr.fedorainfracloud.org/api/
  #
  # Variables (non-sensitive, visible in logs):
  #   COPR_USERNAME  — FAS username (typically same as Copr owner)
  #   COPR_PROJECT   — `<owner>/<project>` (e.g. `kit3713/proteus`)
  #
  # See `dist/copr/README.md` for the one-time setup walkthrough.
  #
  # `continue-on-error: true`: a failed Copr submission must not block the
  # release (raw binaries + GitHub Release are the canonical artifacts).
  # The job no-ops gracefully when `COPR_TOKEN` is empty so contributors
  # forking the repo without a Copr project don't see a red workflow.
  publish-copr:
    name: publish to copr
    runs-on: ubuntu-latest
    container: fedora:43
    needs: [build-rpm]
    continue-on-error: true
    steps:
      - name: Install git + copr-cli
        run: dnf install -y git copr-cli
      - name: Download RPM artifact (includes the .src.rpm)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: proteus-rpm
          path: rpm-artifacts
      - name: Configure copr-cli (skip when secrets unset)
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ vars.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          set -eu
          if [ -z "${COPR_TOKEN:-}" ]; then
            echo "::notice::COPR_TOKEN not set — skipping Copr submission"
            echo "COPR_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p ~/.config
          umask 077
          cat > ~/.config/copr <<CFG
          [copr-cli]
          login = ${COPR_LOGIN}
          username = ${COPR_USERNAME}
          token = ${COPR_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          CFG
      - name: Submit SRPM to Copr
        if: env.COPR_SKIP != '1'
        env:
          # Trim leading/trailing whitespace defensively — pasting into
          # the GitHub Variables UI sometimes carries a stray space or
          # newline that copr-cli then rejects ("Project  X does not
          # exist" with a tell-tale double space in the error).
          COPR_PROJECT_RAW: ${{ vars.COPR_PROJECT }}
        run: |
          set -euo pipefail
          COPR_PROJECT=$(printf '%s' "$COPR_PROJECT_RAW" | tr -d '[:space:]')
          : "${COPR_PROJECT:?COPR_PROJECT variable must be set (e.g. kit3713/proteus)}"
          SRPM=$(ls rpm-artifacts/*.src.rpm | head -1)
          if [ -z "$SRPM" ]; then
            echo "::error::no .src.rpm found in proteus-rpm artifact"
            exit 1
          fi
          echo "submitting $SRPM to copr project '$COPR_PROJECT'"
          copr-cli build "$COPR_PROJECT" "$SRPM"

  # Launchpad PPA publish: builds a Debian *source* package (.dsc + .tar.xz
  # + .changes), signs it with the maintainer's GPG key, and `dput`s it to
  # the configured PPA. Launchpad's build farm then produces .deb binaries
  # for the targeted Ubuntu series.
  #
  # Requires four repo configuration values at
  # `https://github.com/Kit3713/Proteus/settings/secrets/actions`:
  #
  # Secrets:
  #   LAUNCHPAD_GPG_PRIVATE_KEY  — full ASCII-armored private key the GPG
  #                                key UID matches debian/changelog's
  #                                maintainer line; this is the same key
  #                                you registered on launchpad.net
  #   LAUNCHPAD_GPG_PASSPHRASE   — passphrase for that key
  #
  # Variables:
  #   LAUNCHPAD_PPA              — `ppa:<lp-user>/<ppa-name>` —
  #                                e.g. `ppa:kit3713/proteus`
  #   LAUNCHPAD_SERIES           — optional, defaults to `noble`. Comma-
  #                                separated list to build for multiple
  #                                Ubuntu releases (e.g. `noble,jammy`).
  #
  # See `dist/launchpad/README.md` for the one-time setup walkthrough.
  #
  # `continue-on-error: true` + graceful skip on missing secret — same
  # pattern as publish-copr.
  publish-ppa:
    name: publish to launchpad ppa
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    needs: [build-deb]
    continue-on-error: true
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git + dput + debuild + gnupg
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates devscripts dput debhelper gnupg2 \
            build-essential fakeroot pkg-config libdbus-1-dev curl
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Import GPG key (skip when secret unset)
        env:
          GPG_KEY: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          GPG_PASS: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
        run: |
          set -eu
          if [ -z "${GPG_KEY:-}" ]; then
            echo "::notice::LAUNCHPAD_GPG_PRIVATE_KEY not set — skipping PPA publish"
            echo "PPA_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # Loopback pinentry so the passphrase is supplied non-interactively.
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" > ~/.gnupg/gpg.conf
          gpgconf --reload gpg-agent || true
          echo "$GPG_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --keyid-format=LONG | awk '/^sec/ {split($2,a,"/"); print a[2]; exit}')
          echo "imported key id: $KEY_ID"
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          # Pre-cache passphrase so debsign doesn't prompt.
          echo "test" | gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASS" \
            --clearsign --local-user "$KEY_ID" > /dev/null
      - name: Install Rust toolchain (debian/control requires >= 1.85)
        if: env.PPA_SKIP != '1'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain none --profile minimal
          source "$HOME/.cargo/env"
          rustup toolchain install --profile minimal stable
          ln -sf "$HOME/.cargo/bin/rustc" /usr/local/bin/rustc
          ln -sf "$HOME/.cargo/bin/cargo" /usr/local/bin/cargo
      - name: Build + sign + dput per Ubuntu series
        if: env.PPA_SKIP != '1'
        env:
          GPG_PASS: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}
          PPA: ${{ vars.LAUNCHPAD_PPA }}
          SERIES_CSV: ${{ vars.LAUNCHPAD_SERIES }}
        run: |
          set -euo pipefail
          : "${PPA:?LAUNCHPAD_PPA variable must be set (e.g. ppa:kit3713/proteus)}"
          SERIES_CSV="${SERIES_CSV:-noble}"

          # Original 1.0.0-1 etc. version from debian/changelog
          BASE_VER=$(dpkg-parsechangelog -l dist/debian/changelog -S Version)
          echo "base version: $BASE_VER"

          for SERIES in ${SERIES_CSV//,/ }; do
            echo "===== building for $SERIES ====="
            WORK=$(mktemp -d)
            cp -a . "$WORK/proteus"
            cp -a "$WORK/proteus/dist/debian" "$WORK/proteus/debian"
            cd "$WORK/proteus"
            # Append ~<series>1 to the version so each upload is unique per
            # series — required by Launchpad which forbids re-uploading the
            # same source version.
            debchange --newversion "${BASE_VER}~${SERIES}1" \
                      --distribution "$SERIES" \
                      --force-distribution \
                      "Auto-build for $SERIES" || true
            # -S = source-only, -sa = include orig tarball, -d = skip
            # build-dep check (rust comes from rustup, not apt). Source
            # package lands in $WORK as .dsc + .tar.xz + .changes.
            dpkg-buildpackage -S -sa -d \
              -k"$GPG_KEY_ID" \
              -p"gpg --batch --pinentry-mode loopback --passphrase $GPG_PASS"
            cd "$WORK"
            CHANGES=$(ls *_source.changes | head -1)
            echo "uploading $CHANGES to $PPA"
            dput "$PPA" "$CHANGES"
            cd "$GITHUB_WORKSPACE"
            rm -rf "$WORK"
          done
