# Roadmap milestone 1.1.0: Proteus is now a cargo workspace. `proteus`
# remains the ROOT package (this directory is `default-members`), so
# `cargo build`, `cargo test`, and every `dist/` packaging recipe keep
# building the binary exactly as before — none of them pass `-p`/`--workspace`.
# Library crates carved out of the binary (e.g. `crates/proteus-types`) live
# under `crates/` and are pulled in as path dependencies below.
[workspace]
members = ["crates/proteus-types"]
default-members = ["."]
# Resolver 3 matches what the root package used implicitly before the
# workspace existed (edition 2024 selects resolver 3), so feature
# unification and the resolved dependency graph stay identical to 1.0.x.
resolver = "3"

[package]
name = "proteus"
version = "1.0.4"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kit3713/Proteus"
description = "Rotates and scrubs the network identifiers your Linux laptop hands out on every join: MAC, DHCP options, IPv6 stable-privacy, hostname, mDNS, TCP fingerprint quirks, Bluetooth name. Single binary; runs on Fedora 43+ with systemd and NetworkManager."
rust-version = "1.85"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# `cargo build --profile release-symbols` produces a release-optimized binary
# with symbols retained, for callgrind / perf / objdump analysis. Same codegen
# settings as `release`; only the symbol table differs. Don't ship this build.
[profile.release-symbols]
inherits = "release"
strip = false
debug = "limited"

# B14: cargo features back the Gentoo USE flags declared in
# dist/gentoo/proteus-0.1.0.ebuild (`IUSE="bluetooth enterprise-wifi nft
# openrc systemd test"`). Today every feature is empty (no `cfg(feature =
# "...")` gates in src/), so toggling them is a no-op at compile time. They
# exist to give packagers a stable surface to wire USE flags through, and
# to make `cargo --no-default-features --features <flag>` round-trip cleanly
# without surprising the resolver. When feature-gated code lands in src/,
# move the relevant deps into the right feature group below — Stream 3
# explicitly does NOT gate src/, so this table starts empty.
#
# `default = []` is intentional: Gentoo's ebuild calls
# `cargo_src_configure --no-default-features` and adds USE→feature pairs
# explicitly. Avoid surprising the upstream cargo install flow by leaving
# the default set empty.
[features]
# Roadmap 1.1.2: `schema` (default-on) wires the `proteus schema`
# subcommand. It forwards to proteus-types' `schema` feature (the
# `JsonSchema` derives) and pulls schemars into the binary for
# `schema_for!`. Default-on so a stock build ships the schema surface;
# removable via `cargo build --no-default-features --features schema=false`
# style invocations (i.e. `--no-default-features`) when chasing the release
# binary-size cap. With it off, `proteus schema` prints a clear "built
# without schema support" message and exits non-zero rather than vanishing.
default = ["schema"]
schema = ["dep:schemars", "proteus-types/schema"]
bluetooth = []
enterprise-wifi = []
nft = []

[dependencies]
# Roadmap 1.1.1: the `--json` output DTOs live in this workspace member; the
# binary re-exports them so existing `use crate::...` paths keep compiling.
# Roadmap 1.1.2: the binary forwards its `schema` feature here so a
# `--no-default-features` build of the binary also drops schemars.
proteus-types = { path = "crates/proteus-types", default-features = false }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Roadmap 1.1.2: only the binary's `schema` subcommand needs schemars (for
# `schema_for!`); gated behind the `schema` feature so a size-trimmed
# `--no-default-features` build drops it entirely. Same minimal feature set
# as proteus-types to avoid dragging in optional integrations.
schemars = { version = "1.2", default-features = false, features = ["derive"], optional = true }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
toml_edit = { version = "0.25", default-features = false, features = ["display", "parse"] }
# bloat-trim 2026-05-07: dropped tracing/attributes (no `#[instrument]` in src) — saves proc-macro compile time, tiny .text shrink.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# bloat-trim 2026-05-07: dropped tracing-subscriber/env-filter — eliminates `matchers` + `regex-automata` + `regex-syntax` (~175 KB stripped). RUST_LOG is now parsed by a hand-rolled adapter on top of `Targets` in src/logging.rs; supports `RUST_LOG=debug` and `RUST_LOG=proteus=trace,zbus=warn` (the syntax we document).
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tracing-journald = "0.3"
anyhow = "1"
thiserror = "2"
include_dir = "0.7"
zbus = { version = "5", default-features = false, features = ["tokio"] }
# bloat-trim 2026-05-07: dropped tokio/macros (no `#[tokio::main]`/`select!`/`pin!` used). zbus pulls tokio/sync+time+net via its default feature set, so our `sync`+`time` were already covered transitively.
# Roadmap C4 (2026-05-11): re-added `macros` + `signal` so the events daemon
# can race a 250 ms tick against SIGTERM / SIGINT via `tokio::select!` and
# drain in-flight rotates gracefully on systemd `ExecStop`. Only the events
# daemon uses these — everywhere else still avoids `select!`.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "signal"] }
getrandom = "0.2"
# Issue #126: advisory flock(2) on /var/lib/proteus/.lock so concurrent `proteus
# apply`/`rotate`/etc. runs serialize. libc is already a transitive dep
# (zbus/tokio), promoting it to a direct dep keeps build graph stable.
libc = { version = "0.2", default-features = false, features = ["std"] }
# Issue #353: `proteus backup` / `proteus restore` bundle the three Proteus
# trees (/etc/proteus, /var/lib/proteus, /etc/proteus/personas) into a
# tar.gz so an operator can move a working install between machines. Both
# crates are widely-used and ship with permissive licenses; we keep the
# default feature sets to avoid widening the dep graph.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
