#
# Roku Ultra (4800/4802 generation, Roku OS 12). Roku OUI. mDNS on for
# _roku-rcp, SSDP for the rest. DHCP option 60 absent (Roku doesn't set
# vendor-class). FQDN absent.

id = "roku-ultra"
display_name = "Roku Ultra (Roku OS 12)"
kind = "stealth"
category = "tv"
oui_pool = ["roku"]
hostname_template = "Roku-{word}"
mdns_advertise = true
bt_name_template = "Roku Ultra"
notes = "Streaming stick / box. SSDP+mDNS heavy on the segment because of the Roku ECP API. DHCP profile is short and clean — the chattiness is multicast not broadcast."

[dhcp_fingerprint]
vendor_class_identifier = ""
fqdn = ""
parameter_request_list = [1, 3, 6, 15]
host_name = ""

[tcp_stack]
window_scale = 5
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = false
addr_gen_mode = "eui64"
send_rs = true

[mdns]
# Roku canonical Bonjour set. _roku-rcp is the Roku Remote Control
# Protocol discovery — every Roku device announces it. The ECP API
# also advertises over mDNS.
services = [
    "_roku-rcp._tcp",
    "_ecp._tcp",
]
txt_hints = [
    "ty=Roku Ultra",
]

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "off"
