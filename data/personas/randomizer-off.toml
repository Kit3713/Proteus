# SPDX-License-Identifier: GPL-3.0-or-later
#
# Randomizer mirror of `Profile::Off`. Listed here so the off baseline
# shows up in `proteus persona list --kind randomizer` next to user-
# authored randomizer recipes. Functionally identical to setting
# `[profile] = "off"`.

id = "randomizer-off"
display_name = "Randomizer — Off"
kind = "randomizer"
category = "generic"
oui_pool = []
hostname_template = "{word}"
mdns_advertise = false
bt_name_template = ""
rotate_cadence = "never"
notes = "Hard kill. Nothing rotates. Mirrors Profile::Off; included only so the randomizer catalogue is complete."

[dhcp_fingerprint]
vendor_class_identifier = ""
fqdn = ""
parameter_request_list = []
host_name = ""

[tcp_stack]
window_scale = 0
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = false
addr_gen_mode = ""
send_rs = false

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "auto"
