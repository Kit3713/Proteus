#
# iPhone 15 (A2846/A2847/A2848/A2849, iOS 17+). Apple OUI, mDNS chatter
# left on (Apple devices announce loudly), DHCP option 60 = "iPhone".
# See `proteus wiki personas` for the schema and verification recipe.

id = "iphone-15"
display_name = "iPhone 15 (iOS 17)"
kind = "stealth"
category = "phone"
oui_pool = ["apple"]
hostname_template = "{owner}s-iPhone"
mdns_advertise = true
bt_name_template = "{owner}'s iPhone"
notes = "iOS 17 baseline. mDNS Bonjour advertises _apple-mobdev2, _companion-link, and _airdrop on real devices. DHCP option 60 'iPhone' is the canonical Fingerbank match. Option-55 ordering 1-3-6-15-119-252 matches packet captures from iOS 17.x."

[dhcp_fingerprint]
vendor_class_identifier = "iPhone"
fqdn = ""
# DHCP option 55 (parameter request list): subnet-mask, router, DNS,
# domain-name, domain-search (RFC 3397), private/MS-classless-route (252).
# Short, in this exact order — the Fingerbank signature for iOS 16/17.
parameter_request_list = [1, 3, 6, 15, 119, 252]
host_name = ""

[tcp_stack]
# iOS 17 TCP shape (Darwin XNU stack): window scale 6, timestamps + SACK
# on, TTL 64. Distinct from Linux 7-8/Windows 8 — these values match a
# real iPhone's signature in p0f / nmap captures.
window_scale = 6
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = true
addr_gen_mode = "stable-privacy"
send_rs = true

[mdns]
# Apple iOS canonical Bonjour service set: AirDrop discovery, the
# mobdev2 sync service, and Continuity. A real iPhone always advertises
# at least these on join. Issue #305: silence on the multicast layer
# is what classifies a Proteus user; emitting the canonical set is the
# fix. See `proteus help wiki personas` and the issue thread.
services = [
    "_apple-mobdev2._tcp",
    "_companion-link._tcp",
    "_airdrop._tcp",
    "_rdlink._tcp",
]
txt_hints = [
    "model=iPhone15,2",
    "osxvers=23",
]

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "auto"
