#
# Nintendo Switch (HAC-001/HAC-001(-01) — original family). Nintendo OUI
# space; for now we fall back to LAA pending the integration follow-up's
# OUI registry expansion.

id = "nintendo-switch"
display_name = "Nintendo Switch"
kind = "stealth"
category = "console"
oui_pool = ["nintendo", "random-locally-administered"]
hostname_template = "Nintendo-Switch"
mdns_advertise = false
bt_name_template = "Nintendo Switch"
notes = "Switch DHCP signature is unusually short; that brevity is itself the fingerprint. Console networking stack does not advertise mDNS."

[dhcp_fingerprint]
vendor_class_identifier = ""
fqdn = ""
parameter_request_list = [1, 3, 6, 15]
host_name = "Nintendo-Switch"

[tcp_stack]
window_scale = 6
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = false
addr_gen_mode = "eui64"
send_rs = false

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "auto"
