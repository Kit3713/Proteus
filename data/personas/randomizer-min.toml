#
# Randomizer mirror of `Profile::Min`. Trusted home LAN: rotation off,
# nothing breaks discovery.

id = "randomizer-min"
display_name = "Randomizer — Min"
kind = "randomizer"
category = "generic"
oui_pool = ["apple", "intel", "samsung", "dell"]
hostname_template = "{word}-{n}"
mdns_advertise = false
bt_name_template = ""
rotate_cadence = "never"
notes = "Trusted home LAN baseline. Rotation off; per-knob overrides are still applied (unlike Off, which short-circuits)."

[dhcp_fingerprint]
vendor_class_identifier = ""
fqdn = ""
parameter_request_list = []
host_name = ""

[tcp_stack]
window_scale = 7
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = true
addr_gen_mode = "stable-privacy"
send_rs = true

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "auto"
