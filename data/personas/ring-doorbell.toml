#
# Ring Video Doorbell (4 / Pro / Wired). Ring (Amazon-acquired) OUI.
# Cellular-camera-like profile: short DHCP option list, mDNS off, IPv4
# only (Ring devices don't typically request IPv6).

id = "ring-doorbell"
display_name = "Ring Video Doorbell"
kind = "stealth"
category = "iot"
oui_pool = ["amazon"]
hostname_template = "RING-{n}"
mdns_advertise = false
bt_name_template = "Ring"
notes = "Ring uses Amazon-allocated OUIs since the acquisition. The hostname pattern matches what shows up on the home network (RING-XXXXX). BLE is on for the setup flow; Wi-Fi is the run-state path."

[dhcp_fingerprint]
vendor_class_identifier = ""
fqdn = ""
parameter_request_list = [1, 3, 6, 15, 33, 51]
host_name = ""

[tcp_stack]
window_scale = 4
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = false
addr_gen_mode = "eui64"
send_rs = false

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "on"
