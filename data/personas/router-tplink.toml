#
# TP-Link consumer router (Archer AX series, OpenWrt 23.05 and stock
# firmware both observed). Useful when the cover story is "this is a
# downstream router on the segment, not a client device".

id = "router-tplink"
display_name = "TP-Link Router (Archer AX)"
kind = "stealth"
category = "router"
oui_pool = ["tplink", "random-locally-administered"]
hostname_template = "Archer-AX{n}"
mdns_advertise = false
bt_name_template = ""
notes = "Router-class persona. The TP-Link OUI registry expansion is part of the integration follow-up; the LAA fallback keeps the persona functional today."

[dhcp_fingerprint]
vendor_class_identifier = "udhcp 1.30.1"
fqdn = ""
parameter_request_list = [1, 3, 6, 12, 15, 28, 42]
host_name = "Archer"

[tcp_stack]
window_scale = 5
mss = 1460
tcp_timestamps = false
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = false
addr_gen_mode = "eui64"
send_rs = true

[mdns]
# TP-Link consumer routers do not run a full mDNS responder by default
# (the Tether mobile app uses HTTPS over the WAN/IGD discovery, not
# Bonjour). OpenWrt / DD-WRT installs may flip this on. Empty matches
# stock firmware.
services = []
txt_hints = []

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "off"
