#
# PlayStation 5 (CFI-1000/CFI-1100/CFI-1200). Sony OUI in the integration
# follow-up; LAA fallback for now. Console networking stack, no mDNS.

id = "playstation-5"
display_name = "PlayStation 5"
kind = "stealth"
category = "console"
oui_pool = ["sony", "random-locally-administered"]
hostname_template = "PlayStation-5"
mdns_advertise = false
bt_name_template = "PlayStation 5"
notes = "PS5 DHCP banner observed in the wild; OS retains FreeBSD ancestry which shows in the parameter-request-list ordering."

[dhcp_fingerprint]
vendor_class_identifier = ""
fqdn = ""
parameter_request_list = [1, 3, 6, 15, 28, 51]
host_name = "PlayStation-5"

[tcp_stack]
window_scale = 6
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = false
addr_gen_mode = "eui64"
send_rs = true

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "off"
