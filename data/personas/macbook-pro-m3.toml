#
# MacBook Pro M3 (A2992/A2918, macOS Sonoma 14+). Apple OUI, mDNS on
# (macOS announces _ssh, _smb, _afpovertcp, _airdrop), DHCP option 60 absent
# (Apple notebooks don't set vendor-class).

id = "macbook-pro-m3"
display_name = "MacBook Pro M3 (Sonoma)"
kind = "stealth"
category = "laptop"
oui_pool = ["apple"]
hostname_template = "{owner}s-MacBook-Pro"
mdns_advertise = true
bt_name_template = "{owner}'s MacBook Pro"
notes = "M3/M3 Pro/M3 Max, Sonoma 14+. macOS does not advertise a DHCP vendor-class identifier — leaving option 60 empty matches Apple's wire profile. Bonjour announcements are the loudest tell; persona keeps them on so the host reads as macOS."

[dhcp_fingerprint]
vendor_class_identifier = ""
fqdn = ""
parameter_request_list = [1, 3, 6, 15, 119, 95, 252, 44, 46]
host_name = ""

[tcp_stack]
window_scale = 6
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = true
addr_gen_mode = "stable-privacy"
send_rs = true

[mdns]
# macOS Sonoma canonical Bonjour set: SSH, AFP/SMB sharing, AirDrop,
# Continuity, the printer-discovery family. macOS announces every one
# of these on join — silence is the giveaway for a Linux box wearing
# the macOS L2 cover.
services = [
    "_ssh._tcp",
    "_afpovertcp._tcp",
    "_smb._tcp",
    "_airdrop._tcp",
    "_companion-link._tcp",
    "_apple-mobdev2._tcp",
    "_printer._tcp",
    "_ipp._tcp",
]
txt_hints = [
    "model=MacBookPro18,1",
    "osxvers=23",
]

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "auto"
