#
# Samsung Smart TV 2024 (Tizen 8.0 family — QN65/QN75 series). Samsung
# OUI, mDNS on (smart TVs advertise loudly), DHCP option 60 follows the
# Tizen banner.

id = "samsung-tv-2024"
display_name = "Samsung Smart TV 2024 (Tizen 8)"
kind = "stealth"
category = "tv"
oui_pool = ["samsung"]
hostname_template = "Samsung-TV-{n}"
mdns_advertise = true
bt_name_template = "[TV] Samsung 65"
notes = "Tizen 8 smart-TV baseline. _samsungmsf and _viziocast services on mDNS; the integration follow-up will own which services we actually emit."

[dhcp_fingerprint]
vendor_class_identifier = "Tizen 8.0"
fqdn = ""
parameter_request_list = [1, 3, 6, 15, 28, 33, 42, 51, 58, 59]
host_name = "Samsung-TV"

[tcp_stack]
window_scale = 7
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = false
addr_gen_mode = "eui64"
send_rs = true

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "off"
