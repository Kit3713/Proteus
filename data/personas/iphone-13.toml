#
# iPhone 13 (A2482/A2631, iOS 15-17). Same family signature as iPhone 15
# but a slightly older parameter-request-list ordering observed in the
# wild. Useful when the iPhone 15 fingerprint is "too new" for the cover
# story (e.g. a 2-year-old device claim).

id = "iphone-13"
display_name = "iPhone 13 (iOS 16)"
kind = "stealth"
category = "phone"
oui_pool = ["apple"]
hostname_template = "{owner}s-iPhone"
mdns_advertise = true
bt_name_template = "{owner}'s iPhone"
notes = "iOS 16 baseline. PRL ordering matches captures from real iPhone 13 devices on iOS 16.x."

[dhcp_fingerprint]
vendor_class_identifier = "iPhone"
fqdn = ""
parameter_request_list = [1, 3, 6, 15, 119, 252]
host_name = ""

[tcp_stack]
window_scale = 6
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = true
addr_gen_mode = "stable-privacy"
send_rs = true

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "auto"
