#
# iPhone 13 (A2482/A2631, iOS 15-17). Same family signature as iPhone 15
# but a slightly older parameter-request-list ordering observed in the
# wild. Useful when the iPhone 15 fingerprint is "too new" for the cover
# story (e.g. a 2-year-old device claim).

id = "iphone-13"
display_name = "iPhone 13 (iOS 16)"
kind = "stealth"
category = "phone"
oui_pool = ["apple"]
hostname_template = "{owner}s-iPhone"
mdns_advertise = true
bt_name_template = "{owner}'s iPhone"
notes = "iOS 16 baseline. PRL ordering matches captures from real iPhone 13 devices on iOS 16.x. mDNS service set matches iPhone 15 — same Bonjour advertisements across the iOS 15-17 lineage."

[dhcp_fingerprint]
vendor_class_identifier = "iPhone"
fqdn = ""
# Same canonical iOS option-55 list as iphone-15 — the signature has
# been stable from iOS 13 through iOS 17.
parameter_request_list = [1, 3, 6, 15, 119, 252]
host_name = ""

[tcp_stack]
window_scale = 6
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = true
addr_gen_mode = "stable-privacy"
send_rs = true

[mdns]
# Same Bonjour service set as iphone-15 — Apple has not changed the
# canonical iOS mDNS posture across the 13/14/15 generations.
services = [
    "_apple-mobdev2._tcp",
    "_companion-link._tcp",
    "_airdrop._tcp",
    "_rdlink._tcp",
]
txt_hints = [
    "model=iPhone14,5",
    "osxvers=22",
]

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "auto"
