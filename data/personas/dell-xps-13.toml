#
# Dell XPS 13 (9340, Windows 11). Intel Wi-Fi OUI; DHCP option 60 =
# "MSFT 5.0" (Microsoft DHCP client signature); FQDN sent (Windows
# default). mDNS off — Windows uses LLMNR/NBNS by default.

id = "dell-xps-13"
display_name = "Dell XPS 13 (Win 11)"
kind = "stealth"
category = "laptop"
oui_pool = ["intel"]
hostname_template = "DESKTOP-{n}"
mdns_advertise = false
bt_name_template = "DESKTOP-{n}"
notes = "Intel AX211 Wi-Fi card on the 9340 generation. MSFT 5.0 is the canonical DHCP option 60 emitted by every Windows 7+ release. The DESKTOP-XXXXX hostname pattern is Windows's auto-generated default."

[dhcp_fingerprint]
vendor_class_identifier = "MSFT 5.0"
fqdn = "DESKTOP.local"
parameter_request_list = [1, 3, 6, 15, 31, 33, 43, 44, 46, 47, 121, 249, 252]
host_name = ""

[tcp_stack]
window_scale = 8
mss = 1460
tcp_timestamps = false
tcp_sack = true
default_ttl = 128

[ipv6_traits]
use_temp_addresses = true
addr_gen_mode = "stable-privacy"
send_rs = true

[mdns]
# Windows 11 historically used LLMNR/NBNS rather than mDNS, but as of
# 22H2 Windows ships an mDNS responder that announces a small set of
# services for nearby printer/sharing discovery. Compared to macOS this
# list is narrow — just SMB and (if printing roles installed) IPP.
services = [
    "_smb._tcp",
    "_ipp._tcp",
]
txt_hints = [
    "model=Latitude9430",
]

[rf_traits]
tx_power_dbm = 0
scan_style = "active"
power_save = "auto"
