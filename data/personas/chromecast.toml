#
# Chromecast (4th gen with Google TV). Google OUI, mDNS very loud
# (announces _googlecast._tcp), small DHCP request list characteristic
# of Cast hardware.

id = "chromecast"
display_name = "Chromecast (Google TV)"
kind = "stealth"
category = "tv"
oui_pool = ["google"]
hostname_template = "Chromecast-{n}"
mdns_advertise = true
bt_name_template = "Chromecast"
notes = "Cast-hardware baseline. _googlecast._tcp advertisement is the diagnostic giveaway; integration follow-up will gate that emission so the persona is actually convincing."

[dhcp_fingerprint]
vendor_class_identifier = "Google Cast"
fqdn = ""
parameter_request_list = [1, 3, 6, 15, 26, 28, 51, 58, 59]
host_name = "Chromecast"

[tcp_stack]
window_scale = 6
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = false
addr_gen_mode = "eui64"
send_rs = true

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "auto"
