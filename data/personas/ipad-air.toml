#
# iPad Air (5th gen, M1, iPadOS 17). Apple OUI. DHCP option 60 = "iPad".
# mDNS chatty — iPad announces _airdrop, _apple-mobdev2, _companion-link.

id = "ipad-air"
display_name = "iPad Air (iPadOS 17)"
kind = "stealth"
category = "tablet"
oui_pool = ["apple"]
hostname_template = "{owner}s-iPad"
mdns_advertise = true
bt_name_template = "{owner}'s iPad"
notes = "5th-gen iPad Air (M1) and similar. iPadOS DHCP fingerprint mirrors iPhone except option 60 = 'iPad'. AirDrop/Continuity bring more BLE chatter than the phone profile."

[dhcp_fingerprint]
vendor_class_identifier = "iPad"
fqdn = ""
parameter_request_list = [1, 3, 6, 15, 119, 252]
host_name = ""

[tcp_stack]
window_scale = 6
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = true
addr_gen_mode = "stable-privacy"
send_rs = true

[mdns]
# iPadOS canonical Bonjour set: AirDrop, Continuity, mobile-device sync,
# and the rdlink remote-input service tablets use to talk to keyboards
# / mice in setup. Same shape as iPhone but iPad adds _ipp-tls for the
# AirPrint client.
services = [
    "_apple-mobdev2._tcp",
    "_companion-link._tcp",
    "_airdrop._tcp",
    "_rdlink._tcp",
    "_ipp-tls._tcp",
]
txt_hints = [
    "model=iPad13,16",
    "osxvers=23",
]

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "auto"
