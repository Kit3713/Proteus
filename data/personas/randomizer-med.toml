#
# Randomizer mirror of `Profile::Med` — the v0.2 default. Public Wi-Fi
# baseline: 2h MAC rotation, mDNS/LLMNR silenced, breaking knobs off.

id = "randomizer-med"
display_name = "Randomizer — Med (default)"
kind = "randomizer"
category = "generic"
oui_pool = ["apple", "intel", "samsung", "dell", "random-locally-administered"]
hostname_template = "{word}-{n}"
mdns_advertise = false
bt_name_template = ""
rotate_cadence = "2h"
notes = "Public Wi-Fi default. This is the recommended baseline for daily use on coffee-shop, hotel, and airport networks; matches the existing Profile::Med slider."

[dhcp_fingerprint]
vendor_class_identifier = ""
fqdn = ""
parameter_request_list = []
host_name = ""

[tcp_stack]
window_scale = 7
mss = 1460
tcp_timestamps = false
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = true
addr_gen_mode = "stable-privacy"
send_rs = true

[rf_traits]
tx_power_dbm = 0
scan_style = "passive"
power_save = "auto"
