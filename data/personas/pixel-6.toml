#
# Pixel 6 (GR1YH, Android 13/14). Google OUI, DHCP option 60 = "android-dhcp-13"
# (Fingerbank's canonical match for Pixel 6 era). mDNS off — Android phones
# do not Bonjour like iOS does.

id = "pixel-6"
display_name = "Pixel 6 (Android 14)"
kind = "stealth"
category = "phone"
oui_pool = ["google"]
hostname_template = "Pixel-6-{n}"
mdns_advertise = false
bt_name_template = "Pixel 6"
notes = "GR1YH Tensor SoC. Android-dhcp-13 is the FingerBank vendor-class string Pixel emits in real life; later Pixel firmware bumps the version digit. mDNS off matches stock Android."

[dhcp_fingerprint]
vendor_class_identifier = "android-dhcp-13"
fqdn = ""
parameter_request_list = [1, 3, 6, 15, 26, 28, 51, 58, 59, 43]
host_name = ""

[tcp_stack]
window_scale = 8
mss = 1460
tcp_timestamps = true
tcp_sack = true
default_ttl = 64

[ipv6_traits]
use_temp_addresses = true
addr_gen_mode = "stable-privacy"
send_rs = true

[rf_traits]
tx_power_dbm = 0
scan_style = "active"
power_save = "auto"
