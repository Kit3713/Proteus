#
# Xbox Series X/S, current dashboard. Microsoft OUI. DHCP option 60 =
# "MSFT 5.0" (Xbox uses the Windows DHCP client). mDNS off; the console
# uses SSDP for the Xbox Live discovery and Bluetooth for controller pairing.

id = "xbox-series-x"
display_name = "Xbox Series X/S"
kind = "stealth"
category = "console"
oui_pool = ["microsoft"]
hostname_template = "XboxOne-{n}"
mdns_advertise = false
bt_name_template = "Xbox Wireless Controller"
notes = "Series X and Series S share the same wire profile. The XboxOne-* hostname is the inheritance from the previous-gen naming scheme; the dashboard still emits it on DHCP option 12 unless the user customises."

[dhcp_fingerprint]
vendor_class_identifier = "MSFT 5.0"
fqdn = ""
parameter_request_list = [1, 3, 6, 15, 31, 33, 43, 44, 46, 47, 121, 249, 252]
host_name = ""

[tcp_stack]
window_scale = 8
mss = 1460
tcp_timestamps = false
tcp_sack = true
default_ttl = 128

[ipv6_traits]
use_temp_addresses = true
addr_gen_mode = "stable-privacy"
send_rs = true

[rf_traits]
tx_power_dbm = 0
scan_style = "active"
power_save = "off"
